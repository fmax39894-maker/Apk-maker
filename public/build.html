<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>5 — Build</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b13;overflow-x:hidden;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}body{overscroll-behavior-y:none}.wrap{max-width:1000px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:18px}.step{color:#8291a8;font-size:13px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}.steps div{background:#0d1522;color:#718099;padding:11px 4px;text-align:center;border-radius:10px;font-size:12px}.steps .on{background:#1d2e4b;color:#fff}.bar{height:7px;background:#03070c;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;background:#4d8cff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.card{background:#101827;border:1px solid #263650;border-radius:20px;padding:20px}.h{margin:0 0 7px;font-size:28px}.muted{color:#8f9db2;font-size:13px;line-height:1.5}.btn{border:0;border-radius:12px;padding:14px;font-weight:900;cursor:pointer;background:#243550;color:#fff}.primary{background:#4d8cff}.btn:disabled{opacity:.55}.status{padding:14px;background:#08111d;border:1px solid #293b57;border-radius:12px;margin-top:12px}.progress{height:8px;background:#03070c;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:#4d8cff;transition:width .25s}.console-wrap{margin-top:12px}.console-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}.console-title{font-size:12px;font-weight:900;color:#cbd6e7}.smallbtn{padding:7px 9px;border:1px solid #30435f;border-radius:9px;background:#0b1420;color:#dbe5f5;font-size:11px;font-weight:800}.logs{height:300px;min-height:300px;max-height:300px;overflow-y:scroll;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;overscroll-behavior-x:none;background:#05090f;border:1px solid #1e2c42;border-radius:10px;padding:10px;font:10px/1.55 monospace;color:#aebbd0;white-space:pre-wrap;word-break:break-word;user-select:text;resize:none;display:block}.success{border-color:#2c6d50;background:#0b1e17}.error{border-color:#6b3340;background:#24131a}.preview{width:100%;height:420px;border:1px solid #2c3e58;border-radius:12px;background:#fff}.download{display:block;text-align:center;text-decoration:none;margin-bottom:10px;background:#35ca8a;color:#04150d;padding:14px;border-radius:12px;font-weight:900}@media(max-width:760px){.grid{grid-template-columns:1fr}.preview{height:300px}.card{padding:16px}.logs{height:260px;min-height:260px;max-height:260px}.steps div{font-size:10px;padding:9px 2px}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand">⚡ HTML APK Studio</div><span class="step">5 / 5</span></div>
<div class="steps"><div>1 Code</div><div>2 Icon</div><div>3 Permissions</div><div>4 Colours</div><div class="on">5 Build</div></div><div class="bar"><i style="width:100%"></i></div>
<div class="grid"><section class="card"><h1 class="h">Build APK</h1><div id="summary"></div><button id="build" class="btn primary" style="width:100%;margin-top:15px">🚀 Create APK</button>
<div id="status" class="status"><b id="stage">Ready</b><div class="progress"><i id="prog"></i></div><span id="msg" class="muted">Your APK is built and signed on the server.</span></div>
<div id="out" class="console-wrap" hidden><div class="console-head"><span class="console-title">LIVE BUILD LOG</span><button id="latest" class="smallbtn">↓ Latest</button></div><textarea id="logs" class="logs" aria-label="Live build log" readonly spellcheck="false"></textarea></div></section>
<section class="card"><h2 style="margin-top:0">Preview</h2><iframe id="preview" class="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></section></div></div>
<script>
const $=id=>document.getElementById(id);let S=JSON.parse(localStorage.apkStudio||"{}");
$('summary').innerHTML='<p class="muted"><b>App:</b> '+esc(S.name||'My App')+'</p><p class="muted"><b>Package:</b> '+esc(S.pkg||'com.example.myapp')+'</p><p class="muted"><b>Permissions:</b> '+esc((S.permissions||['INTERNET']).join(', '))+'</p>';
$('preview').srcdoc=S.code||'<h1>My App</h1>';
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let follow=true, userScrolled=false;
$('logs').addEventListener('scroll',()=>{const e=$('logs');const atBottom=e.scrollHeight-e.scrollTop-e.clientHeight<48;userScrolled=!atBottom;follow=atBottom});
$('latest').onclick=()=>{userScrolled=false;follow=true;requestAnimationFrame(()=>{$('logs').scrollTop=$('logs').scrollHeight})};
function renderLogs(arr){$('out').hidden=false;const e=$('logs');const wasBottom=e.scrollHeight-e.scrollTop-e.clientHeight<48;e.value=(arr||[]).map(x=>x.line).join('\n');if(follow||wasBottom)requestAnimationFrame(()=>{e.scrollTop=e.scrollHeight;});}
async function poll(id){while(true){let r=await fetch('/api/build/'+id,{cache:'no-store'});let j=await r.json();if(!r.ok)throw Error(j.error||'Build status unavailable');$('stage').textContent=j.stage;$('prog').style.width=(j.progress||0)+'%';$('msg').textContent=j.status==='building'?'Android builder is working…':j.status==='done'?'APK ready':j.status==='failed'?'Build failed':'Preparing…';renderLogs(j.logs);if(j.status==='done'){$('status').className='status success';if(!$('download')){$('out').insertAdjacentHTML('afterbegin','<a id="download" class="download" href="'+j.download+'">⬇️ Download APK</a>')}return}if(j.status==='failed'){$('status').className='status error';return}await new Promise(r=>setTimeout(r,1000))}}
$('build').onclick=async()=>{let b=$('build');b.disabled=true;$('stage').textContent='Uploading project…';$('msg').textContent='Starting build…';$('prog').style.width='5%';$('out').hidden=false;try{let fd=new FormData();fd.append('html',new Blob([S.code||''],{type:'text/html'}),'index.html');let d=localStorage.apkIconData;if(d){let blob=await (await fetch(d)).blob();fd.append('icon',blob,localStorage.apkIconName||'icon.png')}for(let [k,v] of Object.entries({name:S.name,pkg:S.pkg,version:S.version,code:S.codev,orientation:S.orientation,min:S.min,bg:S.bg,status:S.status,nav:S.nav,dark:S.dark,zoom:S.zoom,back:S.back,http:S.http}))fd.append(k,v??'');fd.append('permissions',JSON.stringify(S.permissions||['INTERNET']));let r=await fetch('/api/build',{method:'POST',body:fd});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Could not start build');await poll(j.id)}catch(e){$('status').className='status error';$('stage').textContent='Error';$('msg').textContent=e.message;renderLogs([{line:e.stack||e.message}])}finally{b.disabled=false}}
</script></body></html>
