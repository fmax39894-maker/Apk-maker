<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>5 — Build</title><style>*{box-sizing:border-box}body{margin:0;overscroll-behavior-y:none;background:#070b13;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:950px;margin:auto;padding:20px 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900}.step{color:#8291a8;font-size:12px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}.steps div{background:#0d1522;color:#718099;padding:9px 3px;text-align:center;border-radius:9px;font-size:11px}.steps .on{background:#1d2e4b;color:#fff}.bar{height:7px;background:#03070c;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;background:#4d8cff}.card{background:#101827;border:1px solid #263650;border-radius:20px;padding:20px}.h{margin:0 0 7px;font-size:26px}.muted{color:#8f9db2;font-size:13px;line-height:1.5}.field{margin:14px 0}label{font-size:12px;font-weight:800;color:#c9d3e2}input[type=text],input[type=number],select,textarea{width:100%;margin-top:7px;background:#07101b;color:#fff;border:1px solid #30435f;border-radius:11px;padding:12px;outline:0}textarea{min-height:350px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;font:12px/1.55 monospace;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btns{display:flex;gap:10px;margin-top:20px}.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:900;cursor:pointer;background:#243550;color:#fff}.primary{background:#4d8cff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.check{background:#0a1320;border:1px solid #253650;border-radius:10px;padding:11px;font-size:13px}.colors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.colorbox{display:flex;gap:8px;align-items:center}.colorbox input{width:48px;height:35px;padding:2px}.iconrow{display:flex;gap:20px;align-items:center}.icon{width:150px;height:150px;object-fit:cover;border-radius:30px;background:#18243a;border:1px solid #33445f}.preview{width:100%;height:350px;border:1px solid #2c3e58;border-radius:12px;background:#fff}.status{padding:14px;background:#08111d;border:1px solid #293b57;border-radius:12px;margin-top:12px}.progress{height:8px;background:#03070c;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:#4d8cff}.logs{height:210px;min-height:210px;max-height:210px;overflow-y:auto;overflow-x:auto;overscroll-behavior:contain;touch-action:pan-y;background:#05090f;border:1px solid #1e2c42;border-radius:10px;padding:10px;font:10px/1.5 monospace;color:#aebbd0;white-space:pre-wrap}.success{border-color:#2c6d50;background:#0b1e17}.error{border-color:#6b3340;background:#24131a}@media(max-width:650px){.grid2,.checks,.colors{grid-template-columns:1fr}.btns{flex-direction:column}.iconrow{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="top"><div class="brand">⚡ HTML APK Studio</div><span class="step">5 / 5</span></div><div class="steps"><div class="">1 Code</div><div class="">2 Icon</div><div class="">3 Permissions</div><div class="">4 Colours</div><div class="on">5 Build</div></div><div class="bar"><i style="width:100%"></i></div><div class="grid2" style="align-items:start"><section class="card"><h1 class="h">Build APK</h1><div id="summary"></div><button id="build" class="btn primary" style="width:100%;margin-top:15px">🚀 Create APK</button><div id="status" class="status"><b id="stage">Ready</b><div class="progress"><i id="prog"></i></div><span id="msg" class="muted">The build runs as a background job.</span></div><div id="out"></div></section><section class="card"><h2 style="margin-top:0">Preview</h2><iframe id="preview" class="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></section></div></div><script>let S=JSON.parse(localStorage.apkStudio||"{}");summary.innerHTML='<p class="muted"><b>App:</b> '+(S.name||"My App")+'</p><p class="muted"><b>Package:</b> '+(S.pkg||"com.example.myapp")+'</p><p class="muted"><b>Permissions:</b> '+(S.permissions||["INTERNET"]).join(", ")+'</p>';preview.srcdoc=S.code||"<h1>My App</h1>";function E(x){return String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}async function poll(id){while(true){let r=await fetch("/api/build/"+id),j=await r.json();if(!r.ok)throw Error(j.error);stage.textContent=j.stage;prog.style.width=(j.progress||0)+"%";msg.textContent=j.status==="building"?"Gradle is building…":j.status==="done"?"APK ready":j.status==="failed"?"Build failed":"Waiting…";out.innerHTML='<div class="logs">'+E((j.logs||[]).slice().reverse().map(x=>x.line).join("\n"))+'</div>';let lg=out.querySelector('.logs');if(lg)lg.scrollTop=0;if(j.status==="done"){status.className="status success";out.innerHTML='<button class="btn" style="width:100%;background:#35ca8a;color:#04150d;margin-bottom:10px" onclick="location.href=\''+j.download+'\'">⬇️ Download APK</button>'+out.innerHTML;return}if(j.status==="failed"){status.className="status error";return}await new Promise(r=>setTimeout(r,1500))}}build.onclick=async()=>{build.disabled=true;try{let fd=new FormData();fd.append("html",new Blob([S.code||""],{type:"text/html"}),"index.html");let d=localStorage.apkIconData;if(d){let b=await(await fetch(d)).blob();fd.append("icon",b,localStorage.apkIconName||"icon.png")}for(let [k,v] of Object.entries({name:S.name,pkg:S.pkg,version:S.version,code:S.codev,orientation:S.orientation,min:S.min,bg:S.bg,status:S.status,nav:S.nav,dark:S.dark,zoom:S.zoom,back:S.back,http:S.http}))fd.append(k,v??"");fd.append("permissions",JSON.stringify(S.permissions||["INTERNET"]));let r=await fetch("/api/build",{method:"POST",body:fd}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||"Could not start build");await poll(j.id)}catch(e){status.className="status error";stage.textContent="Error";msg.textContent=e.message}finally{build.disabled=false}}</script></body></html>
