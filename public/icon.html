<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>2 — Icon</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">⚡ HTML APK Studio</div><span class="step">2 / 5</span></div><div class="steps"><a href="/code.html">1 Code</a><div class="on">2 Icon</div><a href="/permissions.html">3 Permissions</a><a href="/colours.html">4 Colours</a><a href="/build.html">5 Build</a></div><div class="bar"><i style="width:40%"></i></div><section class="card"><h1 class="h">App icon</h1><p class="muted">Default icon: ❤️ on a white background. Import PNG, JPG or WEBP to replace it.</p><div class="iconrow"><img id="prev" class="icon" src="/default-icon.png" alt="App icon preview"><div><label class="filepick"><span>🖼️ Import image</span><input id="icon" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"></label><button type="button" id="clearBtn" class="btn" style="margin-top:10px;width:100%;max-width:360px">Use default ❤️</button><p id="iname" class="muted icon-note">Default heart icon selected.</p></div></div><div class="btns"><a class="btn" href="/code.html">← Back</a><button class="btn primary" onclick="next()">Continue →</button></div></section></div><script>const inp=document.getElementById('icon'),prev=document.getElementById('prev'),iname=document.getElementById('iname');const old=localStorage.apkIconData;if(old){prev.src=old;iname.textContent=localStorage.apkIconName||'Saved custom icon.'}inp.addEventListener('change',()=>{const f=inp.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){alert('Please choose PNG, JPG or WEBP.');inp.value='';return}if(f.size>5*1024*1024){alert('Icon must be 5 MB or smaller.');inp.value='';return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),max=512,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);const out=c.toDataURL('image/png');localStorage.apkIconData=out;localStorage.apkIconName=f.name;prev.src=out;iname.textContent=f.name+' · optimized to '+c.width+'×'+c.height};im.src=r.result};r.readAsDataURL(f)});document.getElementById('clearBtn').onclick=()=>{localStorage.removeItem('apkIconData');localStorage.removeItem('apkIconName');inp.value='';prev.src='/default-icon.png';iname.textContent='Default heart icon selected.'};function next(){location.href='/permissions.html'}</script></body></html>
