<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 — Colours</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">⚡ HTML APK Studio</div><span class="step">4 / 5</span></div><div class="steps"><a href="/code.html">1 Code</a><a href="/icon.html">2 Icon</a><a href="/permissions.html">3 Permissions</a><div class="on">4 Colours</div><a href="/build.html">5 Build</a></div><div class="bar"><i style="width:80%"></i></div><section class="card"><h1 class="h">Colours & settings</h1><p class="muted">Default WebView background is white. Change it only if your app needs another colour.</p><div class="colors"><label class="colorbox">WebView <input id="bg" type="color" value="#ffffff"></label><label class="colorbox">Status <input id="status" type="color" value="#ffffff"></label><label class="colorbox">Navigation <input id="nav" type="color" value="#ffffff"></label></div><div class="grid2"><div class="field"><label>Orientation</label><select id="orientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option><option value="unspecified">Unspecified</option></select></div><div class="field"><label>Minimum Android</label><select id="min"><option value="23">Android 6+</option><option value="26">Android 8+</option><option value="28">Android 9+</option></select></div></div><div class="checks"><label class="check"><input id="dark" type="checkbox"> Dark status-bar icons</label><label class="check"><input id="zoom" type="checkbox"> Pinch zoom</label><label class="check"><input id="back" type="checkbox" checked> Back navigation</label><label class="check"><input id="http" type="checkbox"> Allow HTTP content</label></div><div class="btns"><a class="btn" href="/permissions.html">← Back</a><button class="btn primary" onclick="next()">Continue to Build →</button></div></section></div><script>let S=JSON.parse(localStorage.apkStudio||'{}');for(const k of ['bg','status','nav','orientation','min'])if(S[k])document.getElementById(k).value=S[k];for(const k of ['dark','zoom','back','http'])if(k in S)document.getElementById(k).checked=!!S[k];function next(){S={...S,bg:bg.value,status:status.value,nav:nav.value,orientation:orientation.value,min:min.value,dark:dark.checked,zoom:zoom.checked,back:back.checked,http:http.checked};localStorage.apkStudio=JSON.stringify(S);location.href='/build.html'}</script></body></html>
