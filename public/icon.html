<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>2 — Icon</title><style>*{box-sizing:border-box}body{margin:0;background:#070b13;color:#f4f7fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:950px;margin:auto;padding:20px 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:900}.step{color:#8291a8;font-size:12px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}.steps div{background:#0d1522;color:#718099;padding:9px 3px;text-align:center;border-radius:9px;font-size:11px}.steps .on{background:#1d2e4b;color:#fff}.bar{height:7px;background:#03070c;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar i{display:block;height:100%;background:#4d8cff}.card{background:#101827;border:1px solid #263650;border-radius:20px;padding:20px}.h{margin:0 0 7px;font-size:26px}.muted{color:#8f9db2;font-size:13px;line-height:1.5}.field{margin:14px 0}label{font-size:12px;font-weight:800;color:#c9d3e2}input[type=text],input[type=number],select,textarea{width:100%;margin-top:7px;background:#07101b;color:#fff;border:1px solid #30435f;border-radius:11px;padding:12px;outline:0}textarea{min-height:350px;font:12px/1.55 monospace;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btns{display:flex;gap:10px;margin-top:20px}.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:900;cursor:pointer;background:#243550;color:#fff}.primary{background:#4d8cff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.check{background:#0a1320;border:1px solid #253650;border-radius:10px;padding:11px;font-size:13px}.colors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.colorbox{display:flex;gap:8px;align-items:center}.colorbox input{width:48px;height:35px;padding:2px}.iconrow{display:flex;gap:20px;align-items:center}.icon{width:150px;height:150px;object-fit:cover;border-radius:30px;background:#18243a;border:1px solid #33445f}.preview{width:100%;height:350px;border:1px solid #2c3e58;border-radius:12px;background:#fff}.status{padding:14px;background:#08111d;border:1px solid #293b57;border-radius:12px;margin-top:12px}.progress{height:8px;background:#03070c;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:#4d8cff}.logs{height:210px;overflow:auto;background:#05090f;border:1px solid #1e2c42;border-radius:10px;padding:10px;font:10px/1.5 monospace;color:#aebbd0;white-space:pre-wrap}.success{border-color:#2c6d50;background:#0b1e17}.error{border-color:#6b3340;background:#24131a}@media(max-width:650px){.grid2,.checks,.colors{grid-template-columns:1fr}.btns{flex-direction:column}.iconrow{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="top"><div class="brand">⚡ HTML APK Studio</div><span class="step">2 / 5</span></div><div class="steps"><div class="">1 Code</div><div class="on">2 Icon</div><div class="">3 Permissions</div><div class="">4 Colours</div><div class="">5 Build</div></div><div class="bar"><i style="width:40%"></i></div><section class="card"><h1 class="h">App icon</h1><p class="muted">Upload the icon that will appear on the Android launcher.</p><div class="iconrow"><img id="prev" class="icon" src="/default-icon.png"><div><input id="icon" type="file" accept="image/png,image/jpeg,image/webp"><p id="iname" class="muted">No custom icon selected.</p></div></div><div class="btns"><button class="btn" onclick="location.href='/code.html'">← Back</button><button class="btn primary" onclick="next()">Continue →</button></div></section></div><script>const inp=document.getElementById("icon");inp.onchange=()=>{let f=inp.files[0];if(f){iname.textContent=f.name;let r=new FileReader();r.onload=()=>prev.src=r.result;r.readAsDataURL(f)}};function next(){let f=inp.files[0];if(!f){location.href="/permissions.html";return}let r=new FileReader();r.onload=()=>{localStorage.apkIconData=r.result;localStorage.apkIconName=f.name;location.href="/permissions.html"};r.readAsDataURL(f)}</script></body></html>
