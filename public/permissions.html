<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 — Permissions</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="top"><div class="brand">⚡ HTML APK Studio</div><span class="step">3 / 5</span></div><div class="steps"><a href="/code.html">1 Code</a><a href="/icon.html">2 Icon</a><div class="on">3 Permissions</div><a href="/colours.html">4 Colours</a><a href="/build.html">5 Build</a></div><div class="bar"><i style="width:60%"></i></div><section class="card"><h1 class="h">Permissions</h1><p class="muted">Select only what the app needs. Internet is enabled by default.</p><div class="checks"><label class="check"><input class="p" value="INTERNET" type="checkbox" checked> 🌐 Internet</label><label class="check"><input class="p" value="CAMERA" type="checkbox"> 📷 Camera</label><label class="check"><input class="p" value="RECORD_AUDIO" type="checkbox"> 🎤 Microphone</label><label class="check"><input class="p" value="ACCESS_FINE_LOCATION" type="checkbox"> 📍 Precise location</label><label class="check"><input class="p" value="ACCESS_COARSE_LOCATION" type="checkbox"> 📍 Approx. location</label><label class="check"><input class="p" value="READ_MEDIA_IMAGES" type="checkbox"> 🖼️ Photos</label><label class="check"><input class="p" value="POST_NOTIFICATIONS" type="checkbox"> 🔔 Notifications</label><label class="check"><input class="p" value="VIBRATE" type="checkbox"> 📳 Vibration</label></div><div class="btns"><a class="btn" href="/icon.html">← Back</a><button class="btn primary" onclick="next()">Continue →</button></div></section></div><script>let S=JSON.parse(localStorage.apkStudio||'{}');if(Array.isArray(S.permissions))document.querySelectorAll('.p').forEach(x=>x.checked=S.permissions.includes(x.value));function next(){S={...S,permissions:[...document.querySelectorAll('.p:checked')].map(x=>x.value)};localStorage.apkStudio=JSON.stringify(S);location.href='/colours.html'}</script></body></html
